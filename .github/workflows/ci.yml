name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build

  services:
    name: ${{ matrix.service }} (lint, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [accounts-service, orders-service, market-data-service, predictions-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - run: ./mvnw -B verify

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [frontend, services]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
