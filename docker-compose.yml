# Local dev environment: `docker compose up --build`
# Mock data only (CLAUDE.md rule 6). Secrets, when needed, come from the
# environment (see .env.example), never from this file.
services:
  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [accounts-service, orders-service, copilot-runtime]

  accounts-service:
    build: ./services/accounts-service
    ports: ["8081:8081"]

  orders-service:
    build: ./services/orders-service
    ports: ["8082:8082"]

  # Internal: no published port. Reached only through the CopilotKit runtime (E5-S4).
  agent-service:
    build:
      context: .
      dockerfile: services/agent-service/Dockerfile
    env_file:
      - path: services/agent-service/.env
        required: false

  # Browser-facing agent endpoint, reached only through the frontend's nginx (/api/copilotkit).
  copilot-runtime:
    build: ./services/copilot-runtime
    depends_on: [agent-service]
