server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The CopilotKit runtime (services/copilot-runtime). Same origin for the browser; the
  # response is a server-sent event stream, so nothing may buffer it.
  location /api/copilotkit {
    proxy_pass http://copilot-runtime:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
